name: Keep-alive ping

on:
  schedule:
    # Every 3 days at 08:00 UTC — keeps the free-tier Supabase project
    # from auto-pausing due to inactivity (pauses after ~7 days idle).
    - cron: "0 8 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          url="https://clientflow-api-3kgj.onrender.com/api/health"
          echo "Pinging $url"
          # Render free tier can take 30-60s to wake from sleep, retry with backoff.
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 60 "$url"; then
              echo "Success on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 20s..."
            sleep 20
          done
          echo "All attempts failed"
          exit 1

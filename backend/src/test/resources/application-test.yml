spring:
  datasource:
    url: jdbc:h2:mem:clientflow_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: clientflow-test-jwt-secret-key-at-least-32-chars
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173
  openai:
    api-key: test-openai-key-not-used-in-unit-tests
    model: gpt-4o-mini
